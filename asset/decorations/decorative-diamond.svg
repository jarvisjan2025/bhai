<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="diaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#E1C490" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Outer Diamond -->
  <polygon points="50,5 95,50 50,95 5,50" fill="none" stroke="url(#diaGold)" stroke-width="2.5" />
  <!-- Inner Diamond -->
  <polygon points="50,18 82,50 50,82 18,50" fill="none" stroke="url(#diaGold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />
  <!-- Center 4-petal flower -->
  <g fill="#9E2A2B" opacity="0.85">
    <ellipse cx="50" cy="38" rx="4" ry="7" />
    <ellipse cx="50" cy="62" rx="4" ry="7" />
    <ellipse cx="38" cy="50" rx="7" ry="4" />
    <ellipse cx="62" cy="50" rx="7" ry="4" />
    <circle cx="50" cy="50" r="3.5" fill="url(#diaGold)" />
  </g>
  <!-- Corner studs -->
  <circle cx="50" cy="5" r="2.5" fill="url(#diaGold)" />
  <circle cx="95" cy="50" r="2.5" fill="url(#diaGold)" />
  <circle cx="50" cy="95" r="2.5" fill="url(#diaGold)" />
  <circle cx="5" cy="50" r="2.5" fill="url(#diaGold)" />
</svg>
