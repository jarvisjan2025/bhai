<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="100%" height="100%">
  <defs>
    <radialGradient id="coupleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEEDD" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FEF0E0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FEF0E0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hairGroom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3528" />
      <stop offset="100%" stop-color="#2D1F18" />
    </linearGradient>
    <linearGradient id="hairBride" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B4E2D" />
      <stop offset="100%" stop-color="#4A2E1A" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50" />
      <stop offset="100%" stop-color="#1A252F" />
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FCEEE2" />
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF758F" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FF758F" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4C2D1F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Warm Aura -->
  <circle cx="190" cy="200" r="170" fill="url(#coupleGlow)" />

  <!-- Soft Little Hearts floating -->
  <path d="M 60,110 C 60,95 80,95 80,110 C 80,95 100,95 100,110 C 100,125 80,140 80,145 C 80,140 60,125 60,110 Z" fill="#FF8FA3" opacity="0.6" transform="rotate(-15, 80, 110) scale(0.65)" />
  <path d="M 290,90 C 290,75 310,75 310,90 C 310,75 330,75 330,90 C 330,105 310,120 310,125 C 310,120 290,105 290,90 Z" fill="#FF8FA3" opacity="0.6" transform="rotate(15, 310, 90) scale(0.6)" />
  <circle cx="190" cy="70" r="3" fill="#E1C490" opacity="0.8" />
  <circle cx="90" cy="180" r="2.5" fill="#E1C490" opacity="0.8" />
  <circle cx="295" cy="170" r="2.5" fill="#E1C490" opacity="0.8" />

  <!-- MAIN COUPLE GROUP -->
  <g filter="url(#softShadow)">

    <!-- ==================== GROOM (LEFT) ==================== -->
    <g transform="translate(45, 20)">
      <!-- Groom Body / Suit -->
      <!-- Legs/Trousers -->
      <path d="M 80,260 L 78,350 L 98,350 L 102,275 L 106,350 L 126,350 L 124,260 Z" fill="#1A252F" />
      <ellipse cx="88" cy="352" rx="14" ry="7" fill="#111" />
      <ellipse cx="116" cy="352" rx="14" ry="7" fill="#111" />

      <!-- Suit Jacket Body -->
      <path d="M 68,185 C 60,200 62,260 68,275 C 90,285 115,285 136,275 C 142,260 144,200 136,185 Z" fill="url(#suitGrad)" />
      <!-- White Shirt V-Neck -->
      <polygon points="90,185 114,185 102,230" fill="#FFFFFF" />
      <!-- Burgundy Bowtie -->
      <path d="M 94,192 L 110,192 L 105,199 L 110,206 L 94,206 L 99,199 Z" fill="#9E2A2B" />
      <circle cx="102" cy="199" r="3.5" fill="#C72C41" />
      <!-- Lapels -->
      <path d="M 76,185 L 94,240 L 90,240 L 68,195 Z" fill="#243342" />
      <path d="M 128,185 L 110,240 L 114,240 L 136,195 Z" fill="#243342" />
      <!-- Pocket Square (Gold) -->
      <rect x="74" y="215" width="10" height="3" rx="1" fill="#E1C490" transform="rotate(-10, 74, 215)" />

      <!-- Left Arm (Holding bride's waist/embracing) -->
      <path d="M 68,190 C 50,210 52,240 70,252 C 78,256 88,252 82,242 C 70,235 68,215 76,200 Z" fill="url(#suitGrad)" />
      <!-- Right Arm (Reaching toward bride's hand) -->
      <path d="M 134,190 C 150,205 160,225 170,235 C 174,240 168,245 162,242 C 152,232 142,215 130,200 Z" fill="url(#suitGrad)" />
      <circle cx="170" cy="238" r="7" fill="#FADBC8" />

      <!-- Groom Head -->
      <!-- Neck -->
      <rect x="94" y="168" width="16" height="20" rx="4" fill="#FADBC8" />
      <!-- Ears -->
      <circle cx="58" cy="135" r="10" fill="#FADBC8" />
      <circle cx="146" cy="135" r="10" fill="#FADBC8" />
      <!-- Face shape -->
      <path d="M 62,125 C 58,160 80,182 102,182 C 124,182 146,160 142,125 C 140,95 64,95 62,125 Z" fill="#FFE0CE" />

      <!-- Groom Eyes (Chibi style, joyful & smiling) -->
      <ellipse cx="82" cy="136" rx="6" ry="7" fill="#2D1F18" />
      <circle cx="80" cy="133" r="2.5" fill="#FFFFFF" />
      <circle cx="84" cy="138" r="1.2" fill="#FFFFFF" />
      
      <ellipse cx="122" cy="136" rx="6" ry="7" fill="#2D1F18" />
      <circle cx="120" cy="133" r="2.5" fill="#FFFFFF" />
      <circle cx="124" cy="138" r="1.2" fill="#FFFFFF" />

      <!-- Eyebrows -->
      <path d="M 75,124 Q 83,120 91,125" fill="none" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 113,125 Q 121,120 129,124" fill="none" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cute Chibi Smile -->
      <path d="M 94,152 Q 102,162 110,152" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round" />
      <!-- Cute Blushed Cheeks -->
      <ellipse cx="74" cy="148" rx="9" ry="5.5" fill="url(#blushGrad)" />
      <ellipse cx="130" cy="148" rx="9" ry="5.5" fill="url(#blushGrad)" />

      <!-- Groom Stylish Hair -->
      <path d="M 58,125 C 54,95 72,75 102,75 C 132,75 150,95 146,125 C 144,110 138,100 125,98 C 115,95 105,102 92,98 C 80,95 68,105 58,125 Z" fill="url(#hairGroom)" />
      <path d="M 64,110 Q 92,90 128,102 Q 100,85 64,110 Z" fill="#5D4037" opacity="0.6" />
      <!-- Hair tuft swoop -->
      <path d="M 96,75 Q 112,65 118,78 Q 110,72 96,75" fill="url(#hairGroom)" />
    </g>

    <!-- ==================== BRIDE (RIGHT) ==================== -->
    <g transform="translate(155, 30)">
      <!-- Bridal Veil (Flowing behind) -->
      <path d="M 60,80 C 10,130 15,280 40,340 C 70,350 140,350 160,340 C 180,280 185,130 140,80 Z" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 2" />
      <path d="M 75,90 C 45,150 45,280 65,330 C 85,335 125,335 140,330 C 155,280 155,150 125,90 Z" fill="#FFFFFF" fill-opacity="0.3" />

      <!-- Bride Long Hair (Back) -->
      <path d="M 62,120 C 40,160 45,240 55,270 C 65,250 68,190 70,160 Z" fill="url(#hairBride)" />
      <path d="M 138,120 C 160,160 155,240 145,270 C 135,250 132,190 130,160 Z" fill="url(#hairBride)" />

      <!-- Bride Wedding Gown -->
      <!-- Skirt Flare -->
      <path d="M 78,215 C 65,250 45,300 35,345 C 75,355 125,355 165,345 C 155,300 135,250 122,215 Z" fill="url(#dressGrad)" />
      <!-- Lace Pattern Overlays -->
      <path d="M 45,335 Q 100,350 155,335" fill="none" stroke="#E8D5C4" stroke-width="1.5" stroke-dasharray="3 3" />
      <path d="M 55,315 Q 100,330 145,315" fill="none" stroke="#E8D5C4" stroke-width="1" stroke-dasharray="3 3" />
      <path d="M 65,290 Q 100,305 135,290" fill="none" stroke="#E8D5C4" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Bodice / Sweetheart Top -->
      <path d="M 80,180 C 80,180 88,175 100,182 C 112,175 120,180 120,180 L 122,220 C 110,225 90,225 78,220 Z" fill="#FFFFFF" stroke="#EADBD0" stroke-width="1" />
      <!-- Gold Waist Ribbon / Sash -->
      <path d="M 78,215 Q 100,222 122,215 L 122,220 Q 100,227 78,220 Z" fill="#E1C490" />
      <ellipse cx="100" cy="220" rx="3.5" ry="2.5" fill="#C9A463" />

      <!-- Bride Neck & Shoulders -->
      <rect x="92" y="160" width="16" height="22" rx="4" fill="#FDE2D2" />
      <ellipse cx="100" cy="175" rx="24" ry="10" fill="#FDE2D2" />

      <!-- Bride Head -->
      <!-- Ears -->
      <circle cx="62" cy="130" r="9" fill="#FDE2D2" />
      <circle cx="138" cy="130" r="9" fill="#FDE2D2" />
      <!-- Pearl Earrings -->
      <circle cx="62" cy="138" r="3" fill="#FFFFFF" stroke="#E1C490" stroke-width="0.8" />
      <circle cx="138" cy="138" r="3" fill="#FFFFFF" stroke="#E1C490" stroke-width="0.8" />

      <!-- Face Shape -->
      <path d="M 66,120 C 62,155 82,175 100,175 C 118,175 138,155 134,120 C 132,95 68,95 66,120 Z" fill="#FFF0E6" />

      <!-- Bride Eyes (Big, gorgeous, expressive chibi eyes) -->
      <ellipse cx="82" cy="130" rx="7" ry="8" fill="#4A2E1A" />
      <ellipse cx="82" cy="132" rx="6" ry="6" fill="#6D4327" />
      <circle cx="79" cy="127" r="3" fill="#FFFFFF" />
      <circle cx="85" cy="133" r="1.5" fill="#FFFFFF" />
      <!-- Eyelashes -->
      <path d="M 74,123 Q 82,118 90,123" fill="none" stroke="#2D1F18" stroke-width="2" stroke-linecap="round" />
      <path d="M 90,122 L 94,120" stroke="#2D1F18" stroke-width="1.5" stroke-linecap="round" />

      <ellipse cx="118" cy="130" rx="7" ry="8" fill="#4A2E1A" />
      <ellipse cx="118" cy="132" rx="6" ry="6" fill="#6D4327" />
      <circle cx="115" cy="127" r="3" fill="#FFFFFF" />
      <circle cx="121" cy="133" r="1.5" fill="#FFFFFF" />
      <!-- Eyelashes -->
      <path d="M 110,123 Q 118,118 126,123" fill="none" stroke="#2D1F18" stroke-width="2" stroke-linecap="round" />
      <path d="M 126,122 L 130,120" stroke="#2D1F18" stroke-width="1.5" stroke-linecap="round" />

      <!-- Eyebrows -->
      <path d="M 76,118 Q 83,114 90,117" fill="none" stroke="#5D4037" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 110,117 Q 117,114 124,118" fill="none" stroke="#5D4037" stroke-width="1.8" stroke-linecap="round" />

      <!-- Sweet Happy Smile -->
      <path d="M 93,146 Q 100,155 107,146" fill="none" stroke="#E63946" stroke-width="2.2" stroke-linecap="round" />
      <!-- Blushed Cheeks -->
      <ellipse cx="74" cy="142" rx="8" ry="5" fill="url(#blushGrad)" />
      <ellipse cx="126" cy="142" rx="8" ry="5" fill="url(#blushGrad)" />

      <!-- Bride Hair Front / Bangs -->
      <path d="M 64,115 C 60,85 75,70 100,70 C 125,70 140,85 136,115 C 134,105 125,95 110,95 C 95,95 90,105 85,95 C 78,95 70,102 64,115 Z" fill="url(#hairBride)" />
      <!-- Soft strand curling at cheek -->
      <path d="M 66,118 Q 63,140 68,150 Q 64,138 68,122 Z" fill="url(#hairBride)" />
      <path d="M 134,118 Q 137,140 132,150 Q 136,138 132,122 Z" fill="url(#hairBride)" />

      <!-- Floral Headpiece / Crown -->
      <g transform="translate(100, 72)">
        <!-- 3 Little White/Pink Flowers on hair -->
        <circle cx="-16" cy="2" r="4.5" fill="#FFFFFF" />
        <circle cx="-16" cy="2" r="2" fill="#FF8FA3" />
        <circle cx="0" cy="-2" r="6" fill="#FFF0F5" />
        <circle cx="0" cy="-2" r="2.5" fill="#E63946" />
        <circle cx="16" cy="2" r="4.5" fill="#FFFFFF" />
        <circle cx="16" cy="2" r="2" fill="#FF8FA3" />
        <!-- Gold leaves in headpiece -->
        <path d="M -8,0 Q -12,-5 -8,-8 Q -4,-5 -8,0" fill="#E1C490" />
        <path d="M 8,0 Q 12,-5 8,-8 Q 4,-5 8,0" fill="#E1C490" />
      </g>

      <!-- Bride Arms & Bridal Bouquet -->
      <!-- Left Arm resting near groom -->
      <path d="M 76,185 C 60,205 55,225 65,240 C 72,245 78,235 76,225 C 72,215 72,198 80,190 Z" fill="#FDE2D2" />
      <!-- Right Arm holding bouquet -->
      <path d="M 124,185 C 135,205 135,225 115,240 C 108,245 105,235 110,225 C 118,215 120,198 120,190 Z" fill="#FDE2D2" />

      <!-- Bridal Bouquet in hands -->
      <g transform="translate(85, 225)">
        <!-- Bouquet wrap -->
        <polygon points="12,18 18,18 16,30 14,30" fill="#E1C490" />
        <path d="M 15,30 Q 10,40 8,46" stroke="#E1C490" stroke-width="1.5" fill="none" />
        <path d="M 15,30 Q 20,40 22,46" stroke="#E1C490" stroke-width="1.5" fill="none" />
        <!-- Roses in bouquet -->
        <circle cx="15" cy="12" r="10" fill="#FF4D6D" />
        <circle cx="15" cy="12" r="6" fill="#C9184A" />
        <circle cx="6" cy="10" r="7" fill="#FF758F" />
        <circle cx="24" cy="10" r="7" fill="#FF758F" />
        <circle cx="10" cy="3" r="6.5" fill="#FFB3C1" />
        <circle cx="20" cy="3" r="6.5" fill="#FFFFFF" />
        <!-- Leaves -->
        <path d="M 0,10 Q -4,6 0,2 Q 4,6 0,10" fill="#557A46" />
        <path d="M 30,10 Q 34,6 30,2 Q 26,6 30,10" fill="#557A46" />
      </g>
    </g>

  </g>
</svg>
